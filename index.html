<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz night – An Apurv Chaturvedi Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8; --ink:#000; --muted:#5B6470; --line:#D5DAE1; --card:#FFFFFF;
  --good:#0E8F63; --bad:#C92A2A;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --read:"Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0F1216; --ink:#F2F4F7; --muted:#9AA4B2; --line:#2A313B; --card:#171B21; }
}
:root[data-theme="dark"]{ --paper:#0F1216; --ink:#F2F4F7; --muted:#9AA4B2; --line:#2A313B; --card:#171B21; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; background:var(--paper); color:var(--ink); }
body{ font-family:var(--display); font-size:18px; line-height:1.45; min-height:100%; }
main{ max-width:1100px; margin:0 auto; padding:32px 24px 140px; }
a{ color:inherit; }
.link{ color:var(--muted); text-decoration:none; font-size:15px; }
.link:hover,.link:focus-visible{ color:var(--ink); text-decoration:underline; }
.muted{ color:var(--muted); }
:focus-visible{ outline:3px solid #2743D8; outline-offset:3px; }

.btn{ font:600 16px/1 var(--display); padding:14px 22px; border-radius:999px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
.btn.primary{ background:var(--ink); color:var(--paper); }
.btn.good{ background:var(--good); border-color:var(--good); color:#fff; }
.btn.bad{ background:transparent; border-color:var(--bad); color:var(--bad); }
.btn.quiet{ border-color:var(--line); }
.btn:hover{ transform:translateY(-1px); }

/* Home */
.home{ display:grid; grid-template-columns:1.1fr 1fr; gap:48px; align-items:end; min-height:calc(100vh - 120px); }
.byline{ grid-column:1/-1; align-self:start; margin:0; color:var(--muted); font-size:15px; }
.title{ font-weight:800; font-size:clamp(88px,15vw,210px); line-height:.82; letter-spacing:-.05em; margin:0; }
.teams{ display:flex; flex-direction:column; gap:10px; }
.lede{ margin:0 0 6px; color:var(--muted); }
.team-input{ display:flex; align-items:center; gap:14px; border-bottom:1.5px solid var(--line); padding:8px 0; }
.team-input:focus-within{ border-color:var(--c); }
.swatch{ width:22px; height:22px; border-radius:6px; background:var(--c); flex:none; }
.team-input input{ font:500 26px/1.2 var(--display); border:0; background:transparent; color:var(--ink); width:100%; outline:none; }
.actions{ display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; }
.rules{ grid-column:1/-1; border-top:1.5px solid var(--line); padding-top:14px; color:var(--muted); }
.rules summary{ cursor:pointer; color:var(--ink); }
.rule-list{ max-width:62ch; padding-left:20px; }

/* Rounds */
.page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-bottom:28px; }
.page-head h2{ font-size:clamp(40px,6vw,64px); letter-spacing:-.03em; margin:4px 0; line-height:1; }
.page-head p{ margin:6px 0 0; }
.round-list{ list-style:none; margin:0; padding:0; border-top:1.5px solid var(--ink); }
.round-row{ display:grid; grid-template-columns:56px 1fr auto; gap:20px; align-items:baseline; padding:22px 0; border-bottom:1.5px solid var(--line); text-decoration:none; }
.round-row:hover .round-name{ text-decoration:underline; text-underline-offset:6px; }
.round-no{ font-size:28px; font-weight:700; color:var(--muted); }
.round-name{ font-size:clamp(24px,3vw,34px); font-weight:700; letter-spacing:-.02em; }
.round-name small,.round-meta small{ display:block; font-size:15px; font-weight:400; color:var(--muted); letter-spacing:0; }
.round-meta{ text-align:right; font-size:15px; }

/* Round grid */
.next-up{ margin:0; font-size:17px; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; }
.tile{ aspect-ratio:1; display:grid; place-items:center; font-size:44px; font-weight:800; text-decoration:none; background:var(--card); border:1.5px solid var(--line); border-radius:18px; }
.tile:hover{ border-color:var(--ink); }
.tile.used{ color:var(--line); background:transparent; border-style:dashed; }
.tile.todo:not(.used)::after{ content:"needs image"; position:absolute; }
.tile.todo{ position:relative; }
.tile.todo:not(.used)::after{ bottom:10px; font-size:12px; font-weight:500; color:var(--muted); }
.board{ display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:10px; overflow-x:auto; }
.board .cat{ font-weight:700; font-size:17px; padding:10px 4px; border-bottom:1.5px solid var(--ink); }
.board .tile{ aspect-ratio:auto; height:96px; font-size:36px; border-radius:14px; }

/* Question */
.question{ display:flex; flex-direction:column; gap:28px; min-height:calc(100vh - 200px); }
.q-head{ display:flex; justify-content:space-between; gap:12px; font-size:15px; }
.q-body{ display:flex; flex-direction:column; gap:24px; }
.clue{ font-family:var(--read); font-size:clamp(22px,2.4vw,34px); line-height:1.45; max-width:38em; margin:0; }
.q-img{ margin:0; }
.q-img img{ max-width:100%; max-height:52vh; border-radius:12px; display:block; }
.q-img figcaption{ display:none; }
.q-img.missing img{ display:none; }
.q-img.missing figcaption{ display:block; border:1.5px dashed var(--line); border-radius:12px; padding:40px 20px; color:var(--muted); text-align:center; font-size:15px; }
.answer{ border-top:1.5px solid var(--line); padding-top:20px; min-height:10px; }
.answer.shown{ border-color:var(--ink); }
.ans-text{ font-size:clamp(28px,3.4vw,48px); font-weight:800; letter-spacing:-.02em; margin:0 0 16px; line-height:1.1; }
.ans-img{ max-width:min(100%,520px); max-height:40vh; border-radius:12px; display:block; }
.controls{ margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
.status{ margin:0; font-size:20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.dot{ width:14px; height:14px; border-radius:50%; display:inline-block; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; }

/* Standings */
.standings{ list-style:none; padding:0; margin:0; }
.standings li{ display:grid; grid-template-columns:60px 1fr auto; align-items:baseline; padding:20px 0; border-bottom:1.5px solid var(--line); }
.place{ font-size:24px; color:var(--muted); font-weight:700; }
.st-name{ font-size:clamp(26px,4vw,44px); font-weight:700; letter-spacing:-.02em; border-left:6px solid var(--c); padding-left:14px; }
.st-score{ font-size:clamp(36px,5vw,64px); font-weight:800; }

/* Scoreboard */
#scores{ position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(4,1fr) auto; background:var(--card); border-top:1.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:10; }
#scores[hidden]{ display:none; }
.sc{ display:grid; grid-template-columns:1fr auto; grid-template-rows:auto auto; padding:10px 16px 12px; border-top:5px solid transparent; }
.sc.active{ border-top-color:var(--c); }
.sc-name{ font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sc-score{ font-size:32px; font-weight:800; grid-row:2; line-height:1.1; }
.sc-name::before{ content:""; display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--c); margin-right:6px; }
.sc-adj{ grid-row:1/3; grid-column:2; display:flex; flex-direction:column; gap:4px; justify-content:center; }
.sc-adj button,.undo{ font:500 13px var(--display); border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:8px; padding:3px 8px; cursor:pointer; }
.undo{ margin:auto 14px; padding:8px 12px; }
.undo:disabled{ opacity:.4; cursor:default; }

@media (max-width:760px){
  main{ padding:20px 16px 170px; }
  .home{ grid-template-columns:1fr; min-height:auto; gap:28px; }
  .round-row{ grid-template-columns:36px 1fr; }
  .round-meta{ grid-column:2; text-align:left; }
  #scores{ grid-template-columns:repeat(2,1fr); }
  .undo{ grid-column:1/-1; margin:0 16px 10px; }
  .sc{ padding:8px 12px; }
  .sc-score{ font-size:24px; }
}
@media (prefers-reduced-motion:reduce){ .btn:hover{ transform:none; } }

/* ---------- Fit to screen ----------
   Every screen fills the browser window exactly. The bottom scoreboard height is
   measured in app.js (--sb); question text is scaled by --k until everything fits. */
main{ height:100vh; height:100dvh; overflow-y:auto; display:flex; flex-direction:column;
  padding:clamp(12px,3vh,32px) 24px calc(var(--sb,0px) + clamp(12px,2.5vh,28px)); }
main > section{ flex:1 1 auto; min-height:0; }
.page-head{ margin-bottom:clamp(12px,3vh,28px); }
.page-head h2{ font-size:clamp(30px,min(6vw,8vh),64px); }

.home{ min-height:0; gap:clamp(20px,4vh,48px); }
.title{ font-size:clamp(60px,min(15vw,22vh),210px); }
.team-input{ padding:clamp(4px,1vh,8px) 0; }
.team-input input{ font-size:clamp(18px,min(2.6vw,3.6vh),26px); }

.rounds{ display:flex; flex-direction:column; }
.round-list{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.round-list li{ flex:1 1 0; min-height:0; }
.round-row{ height:100%; align-items:center; padding:clamp(6px,1.4vh,22px) 0; }
.round-name{ font-size:clamp(18px,min(3vw,3.8vh),34px); }
.round-no{ font-size:clamp(18px,3.2vh,28px); }

.round{ display:flex; flex-direction:column; }
.tiles{ flex:1 1 auto; min-height:0; grid-template-columns:repeat(var(--cols,6),var(--ts,120px)); grid-auto-rows:var(--ts,120px); align-content:start; }
.tile{ aspect-ratio:auto; font-size:calc(var(--ts,120px) * .36); border-radius:clamp(10px,calc(var(--ts,120px) * .14),18px); }
.board{ flex:1 1 auto; min-height:0; grid-template-rows:auto repeat(5,minmax(0,1fr)); }
.board .tile{ height:auto; min-height:36px; font-size:clamp(18px,min(3vw,5vh),36px); }

.question{ min-height:0; height:100%; overflow-y:auto; gap:clamp(10px,2.2vh,28px); }
.q-body{ flex:none; gap:clamp(10px,2vh,24px); }
.q-body.has-img{ flex:1 1 0; min-height:auto; }
.clue{ font-size:calc(clamp(17px,min(2.4vw,3.6vh),34px) * var(--k,1)); }
.q-img{ flex:1 1 0; min-height:min(28vh,220px); position:relative; }
.q-img img{ position:absolute; inset:0; width:100%; height:100%; max-height:none; object-fit:contain; object-position:left center; border-radius:0; }
.q-img.missing{ flex:none; min-height:0; }
.answer{ flex:none; padding-top:clamp(10px,2vh,20px); }
.answer.has-img{ flex:1 1 0; min-height:auto; display:flex; flex-direction:column; gap:clamp(8px,1.6vh,16px); }
.ans-text{ font-size:calc(clamp(22px,min(3.4vw,5vh),48px) * var(--k,1)); margin:0 0 clamp(8px,1.6vh,16px); }
.answer.has-img .ans-text{ margin:0; }
.ans-fig{ flex:1 1 0; min-height:min(20vh,150px); position:relative; margin:0; }
.ans-fig .ans-img{ position:absolute; inset:0; width:100%; height:100%; max-width:none; max-height:none; object-fit:contain; object-position:left top; border-radius:0; }
.btn{ padding:clamp(10px,1.6vh,14px) clamp(16px,2vw,22px); }
.standings li{ padding:clamp(6px,2vh,20px) 0; }
.st-name{ font-size:clamp(22px,min(4vw,7vh),44px); }
.st-score{ font-size:clamp(28px,min(5vw,9vh),64px); }
@media (min-width:900px){
  .answer.has-img{ flex-direction:row; gap:32px; }
  .answer.has-img .ans-text{ flex:0 1 44%; }
}
@media (max-width:760px){
  main{ padding:clamp(10px,2vh,20px) 16px calc(var(--sb,0px) + 12px); }
  .home{ grid-template-columns:1fr; }
  .round-row{ grid-template-columns:30px 1fr auto; gap:10px; }
  .round-name small{ display:none; }
  .round-meta{ grid-column:auto; text-align:right; font-size:12px; line-height:1.3; }
  .round-meta small{ font-size:12px; }
  .q-img{ min-height:min(20vh,170px); }
  .ans-fig{ min-height:min(16vh,130px); }
}
@media (max-height:520px){
  main{ padding-top:10px; padding-bottom:calc(var(--sb,0px) + 8px); }
  .question{ gap:8px; }
  .q-body{ gap:8px; }
  .q-img{ min-height:72px; }
  .ans-fig{ min-height:64px; }
  .answer{ padding-top:8px; }
  .btn{ padding:8px 14px; font-size:14px; }
  .sc{ padding:4px 12px 6px; }
  .sc-score{ font-size:22px; }
}

</style>
</head>
<body>
<main id="app"></main>
<nav id="scores" hidden aria-label="Team scores"></nav>
<script>
/* Questions: edit here. Pictures live in the "images" folder next to this file:
   <question id>.jpg is shown with the question, <question id>-answer.jpg with the answer. */
const ROUNDS = [
{ id:"pc", title:"Pop culture", sub:"Literature, art, media and entertainment", base:10, neg:true, qs:[
 {id:"pc1", q:"X is a British author, screenwriter, producer and philanthropist who also writes crime fiction under the pseudonym Robert Galbraith. Before becoming an author, X worked at Amnesty International as a researcher and bilingual secretary. X is said to have dreamt up the famous series Y on a delayed train from Manchester to London. Y became a hit film franchise, and HBO is now turning it into a TV series.", a:"X = J.K. Rowling, Y = Harry Potter"},
 {id:"pc2", q:"Comedian is a 2019 artwork by Italian artist Maurizio Cattelan, made in an edition of three. It consists of ________. Two editions sold for $120,000 at Art Basel Miami Beach, and in 2024 another sold at Sotheby’s for about $6.2 million – after which the buyer ate the artwork. Cattelan also made “America”, a fully working solid-gold toilet that was stolen from Blenheim Palace in 2019.", a:"A banana duct-taped to a wall", ansImg:true},
 {id:"pc3", q:"X is an American cartoon series first created in 1940, built around the rivalry of its two central characters. It is famous (and criticised) for its slapstick violence – axes, hammers, explosives, electricity, poison and more. It won its creators seven Oscars and led to many spin-offs and feature films, including a 1992 movie and a 2021 live-action/animation hybrid. The two leads were originally named Jasper and Jinx.", a:"Tom and Jerry", ansImg:true},
 {id:"pc4", q:"X refers to shows staged in 41 professional theatres of 500 seats or more in Y. The street has given its name to the whole district, yet only three of those theatres actually sit on X itself. Smaller venues are called “off-X”, and the tiniest (under 100 seats) are “off-off-X”.", a:"X = Broadway, Y = the Theater District, Manhattan (New York City)", ansImg:true},
 {id:"pc5", q:"X is a 2011 romance novel by Y, later part of a trilogy, about a college graduate and a businessman. It began as Twilight fan fiction called “Master of the Universe”, was first released by a small Australian e-publisher, and was picked up by a major publishing house in 2012 after going viral. At the time it became the UK’s best-selling book, overtaking Harry Potter and The Da Vinci Code.", a:"X = Fifty Shades of Grey, Y = E.L. James", ansImg:true},
 {id:"pc6", q:"X is a 1999 song by the American band Y and one of their signature hits. It was written by Max Martin (who also wrote “…Baby One More Time” for Britney Spears) and Andreas Carlsson. It was nominated for three Grammys, including Song and Record of the Year. Critics still argue about what the lyrics mean – mainly, what “that” refers to.", a:"X = I Want It That Way, Y = Backstreet Boys", ansImg:true},
 {id:"pc7", q:"Connect: 20th Century Fox, Hulu, Lucasfilm, National Geographic, ABC, ESPN, Pixar, Marvel.", a:"They are all owned by Disney", img:true}
]},
{ id:"bk", title:"Movies based on books", sub:"Name the film (and the blanks)", base:10, neg:true, qs:[
 {id:"bk1", q:"X (2006) is based on Lauren Weisberger’s 2003 novel of the same name. The New York Times said it defined the image of the personal assistant in the public mind. Its fearsome boss is loosely based on Anna Wintour, who was for decades editor of A and is now chief content officer of B. A sequel arrives in 2026.", a:"X = The Devil Wears Prada, A = Vogue, B = Condé Nast"},
 {id:"bk2", q:"X (2004) is an American teen comedy partly based on the book “Queen Bees and Wannabes” by Rosalind Wiseman, about how high-school girls form cliques. The film became a pop-culture phenomenon – its lines, memes and GIFs are everywhere – and was remade as a musical in 2024.", a:"Mean Girls"},
 {id:"bk3", q:"X (1995) is a fantasy adventure based on a children’s picture book by Chris Van Allsburg. It was turned into an animated TV show, followed by the related movie Y (2005), and two direct sequels in 2017 and 2019.", a:"X = Jumanji, Y = Zathura"},
 {id:"bk4", q:"X (2008) is based on the novel Y (2005) by Vikas Swarup, a former Indian diplomat. It is a rags-to-riches story, partly inspired by a British Army major found guilty of cheating on a TV game show.", a:"X = Slumdog Millionaire, Y = Q & A"},
 {id:"bk5", q:"X (1960) is based on Robert Bloch’s novel of the same name. Often called one of director Y’s best films and one of the greatest ever made, it pushed the limits of violence and sexuality in American cinema and has been called the first “psychoanalytical thriller”.", a:"X = Psycho, Y = Alfred Hitchcock"},
 {id:"bk6", q:"X is a novel published in two volumes in 1868–69 by Y, loosely based on the author’s life with her three sisters. It has been filmed seven times, from 1917 to 2019, and four of those films earned multiple Oscar nominations.", a:"X = Little Women, Y = Louisa May Alcott"},
 {id:"bk7", q:"X (1999) is based on Chuck Palahniuk’s 1996 novel of the same name. Both explore Generation X, consumerism and advertising. The film disappointed at the box office but became one of the biggest cult movies of all time.", a:"Fight Club"},
 {id:"bk8", q:"X (2010) is a Bollywood film based on Jane Austen’s 1815 novel “Emma” – the same book behind Hollywood’s Clueless (1995). It is set among Delhi’s upper-class elite. One critic said it was like a flute of champagne that loses its fizz far too quickly.", a:"Aisha"},
 {id:"bk9", q:"X (1939) is based on Y’s 1936 novel of the same name, an epic romance set during the American Civil War. It won 10 Oscars (two of them honorary) from 13 nominations – records at the time. Adjusted for inflation, it is still the highest-grossing film ever.", a:"X = Gone with the Wind, Y = Margaret Mitchell"}
]},
{ id:"jp", title:"Jeopardy", sub:"Five categories, five questions each. Higher value, harder question.", base:10, neg:true, board:true,
  cats:["Entertainment","Business","Food","Nature","Geography"], qs:[
 {id:"jp-ent-1", cat:0, v:10, q:"X is a 1975 film based on Peter Benchley’s novel of the same name. Shot mostly at Martha’s Vineyard, it was the first major film shot on Y, and production was troubled. Because the mechanical Z kept breaking down, the director mostly suggested its presence with an ominous, minimal music theme. Along with Star Wars, it created the modern blockbuster.", a:"X = Jaws, Y = the ocean, Z = shark"},
 {id:"jp-ent-2", cat:0, v:20, q:"X is a 1965 musical film based on a memoir by Y, adapted from the Broadway show of the same name (over 1,400 performances). It overtook Gone with the Wind as the highest-grossing film ever and held that title for about five years; adjusted for inflation it is still in the all-time top 10. It was shot in Los Angeles and around Salzburg.", a:"X = The Sound of Music, Y = Maria von Trapp"},
 {id:"jp-ent-3", cat:0, v:30, q:"The ________ officially adopted X as the name of its award in 1939, though the origin of the name is disputed. The statuette was first made of bronze; during WWII, metal shortages meant it was made of painted plaster. In over 90 years its design has barely changed, apart from a streamlined base.", a:"X = Oscar, blank = Academy of Motion Picture Arts and Sciences"},
 {id:"jp-ent-4", cat:0, v:40, q:"X is a singer, songwriter and actress known for pushing boundaries with religious, sexual and political themes. X sold over $1.2 billion in the first decade of her career. Back in 1987 and 1993 she drew solo crowds of over 100,000 in Paris and Rio – and in 2024 she played a free show on Copacabana Beach to an estimated 1.6 million people, a record Lady Gaga topped there in 2025.", a:"Madonna"},
 {id:"jp-ent-5", cat:0, v:50, q:"X’s screen persona was built on blonde hair and a breathy, childlike voice, with double entendres dubbed “X-isms”. Possibly the most photographed person of the 20th century, X was ranked sixth among the greatest female screen legends by the American Film Institute.", a:"Marilyn Monroe"},
 {id:"jp-bus-1", cat:1, v:10, q:"In 2020, Hans Zimmer, composer of The Dark Knight, Interstellar and Inception, worked with car maker X to create the driving sounds for its electric cars. X said that as its range of electric models grows, a gap in the emotional experience opens up for drivers. Name the car maker.", a:"BMW (the sound debuted on the BMW i4)"},
 {id:"jp-bus-2", cat:1, v:20, q:"In 2001, Edwin Black’s book “X and the Holocaust” used over 20,000 documents to describe a twelve-year alliance between tech company X and Nazi Germany. X, a leader in punch-card data machines, allegedly helped track millions of victims. X criticised the book’s methods but did not deny the allegations.", a:"IBM"},
 {id:"jp-bus-3", cat:1, v:30, q:"In 1873, tailor Jacob Davis had the idea of strengthening trousers with copper ________. With no money for a patent, he wrote to X, his cloth supplier, and they patented it together. The bow-shaped “Arcuate” stitch on the back pocket has been the brand’s signature ever since.", a:"X = Levi Strauss (Levi’s), blank = rivets"},
 {id:"jp-bus-4", cat:1, v:40, q:"In 2018, Puma’s women’s trainers called “Storm Adrenaline” drew criticism. Why?", a:"Their initials, SA, recalled the Sturmabteilung (“Storm Detachment”), the Nazi paramilitary wing"},
 {id:"jp-bus-5", cat:1, v:50, q:"X names its products after places, people and everyday words instead of codes, reportedly because its founder was dyslexic. Its printed catalogue once ran to over 200 million copies a year before being discontinued in 2020. The brand name is made from the founder’s initials, his family farm and his home village.", a:"IKEA (Ingvar Kamprad, Elmtaryd, Agunnaryd)"},
 {id:"jp-food-1", cat:2, v:10, q:"X was started by Reuben and Rose Mattus in the Bronx, New York, in 1960, with just three flavours. Reuben invented a Danish-sounding name as a tribute to Denmark’s protection of its Jews in WWII – but it means nothing in Danish. Name the ice-cream brand.", a:"Häagen-Dazs"},
 {id:"jp-food-2", cat:2, v:20, q:"X is a famous Swiss chocolate first made in Bern. Its shape is often said to be the Matterhorn, but family lore says it was inspired by a pyramid of dancers at the Folies Bergère in Paris. Because Bern is the “city of bears”, a bear was hidden in its logo. In 2023, as some production moved to Slovakia, the Matterhorn was dropped from the packaging.", a:"Toblerone"},

<script>
const TEAM_COLORS = ["#2743D8","#D6336C","#0E8F63","#D98A00"];
const DEFAULT_TEAMS = ["Team 1","Team 2","Team 3","Team 4"];
const KEY = "apurv-quiz-v1";
const IMG_DIR = "images/";
const imgSrc = n => (window.IMAGES && window.IMAGES[n]) || IMG_DIR + n;
const ALLQ = {}; ROUNDS.forEach(r => r.qs.forEach(q => { q.round = r.id; ALLQ[q.id] = q; }));

let S = load() || fresh();
let cur = null; // current question flow
function fresh(){ return { teams: DEFAULT_TEAMS.map(n=>({name:n, score:0})), used:{}, turn:0, log:[], started:false }; }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const app = document.getElementById("app");
const board = document.getElementById("scores");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pts = (r,q) => q.v || r.base;
const roundOf = q => ROUNDS.find(r => r.id === q.round);

// Navigation is kept in memory so it works even where the page sits inside a viewer that blocks link or hash changes.
let NAV = location.hash.replace("#","");
function go(view, arg){
  NAV = arg ? view + "/" + arg : view;
  try { history.replaceState(null, "", "#" + NAV); } catch(e){}
  route(); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const link = e.target.closest && e.target.closest('a[href^="#"]');
  if (!link) return;
  e.preventDefault();
  const [v, arg] = link.getAttribute("href").slice(1).split("/");
  go(v, arg);
});
window.addEventListener("hashchange", () => { const h = location.hash.replace("#",""); if (h !== NAV){ NAV = h; route(); } });
function route(){
  const [view, arg] = NAV.split("/");
  document.body.dataset.view = view || "home";
  if (!view || view === "home") return renderHome();
  if (view === "rounds") return renderRounds();
  if (view === "round") return renderRound(arg);
  if (view === "q") return renderQuestion(arg);
  if (view === "results") return renderResults();
  renderHome();
}

/* ---------- Home ---------- */
function renderHome(){
  app.innerHTML = `
  <section class="home">
    <p class="byline">An Apurv Chaturvedi Production</p>
    <h1 class="title">Quiz<br>night</h1>
    <div class="teams" id="teamForm">
      <p class="lede">Name your four teams</p>
      ${S.teams.map((t,i)=>`
        <label class="team-input" style="--c:${TEAM_COLORS[i]}">
          <span class="swatch" aria-hidden="true"></span>
          <input value="${esc(t.name)}" data-i="${i}" maxlength="24" aria-label="Team ${i+1} name">
        </label>`).join("")}
      <div class="actions">
        <button class="btn primary" type="button" id="startBtn">${S.started ? "Continue quiz" : "Start quiz"}</button>
        ${S.started ? `<button class="btn quiet" type="button" id="resetBtn">Start over</button>` : ""}
      </div>
    </div>
    <details class="rules">
      <summary>How scoring works</summary>
      ${rulesHTML()}
    </details>
  </section>`;
  const start = () => {
    app.querySelectorAll("input[data-i]").forEach(inp => { S.teams[+inp.dataset.i].name = inp.value.trim() || DEFAULT_TEAMS[+inp.dataset.i]; });
    S.started = true; save(); go("rounds");
  };
  document.getElementById("startBtn").onclick = start;
  app.querySelectorAll("input[data-i]").forEach(inp => inp.onkeydown = e => { if (e.key === "Enter") start(); });
  const rb = document.getElementById("resetBtn");
  if (rb) rb.onclick = () => { if (confirm("Clear all scores and used questions?")) { S = fresh(); save(); renderHome(); renderScores(); } };
  renderScores();
}
function rulesHTML(){
  return `<ul class="rule-list">
    <li>Questions go to teams in turn. The team whose turn it is gets the question <b>direct</b>.</li>
    <li>Direct and correct: full points. Direct and wrong: minus half the points, and the question passes on.</li>
    <li>A team can <b>pass</b> its direct question to avoid the risk. Nothing is lost.</li>
    <li>Passed questions go to the next team: correct earns half the points, wrong costs nothing.</li>
    <li>Picture rounds have no minus points.</li>
  </ul>`;
}

/* ---------- Rounds ---------- */
function renderRounds(){
  app.innerHTML = `
  <section class="rounds">
    <header class="page-head"><h2>Rounds</h2><a class="link" href="#results">See standings</a></header>
    <ol class="round-list">
      ${ROUNDS.map((r,i)=>{
        const done = r.qs.filter(q=>S.used[q.id]).length;
        return `<li><a class="round-row" href="#round/${r.id}">
          <span class="round-no">${i+1}</span>
          <span class="round-name">${esc(r.title)}<small>${esc(r.sub)}</small></span>
          <span class="round-meta">${scoringLine(r)}<small>${done} of ${r.qs.length} played</small></span>
        </a></li>`; }).join("")}
    </ol>
  </section>`;
  renderScores();
}
function scoringLine(r){
  if (r.board) return `10–50 pts, minus half if wrong`;
  return r.neg ? `${r.base} pts, −${r.base/2} if wrong` : `${r.base} pts, no minus`;
}

/* ---------- Round ---------- */
function renderRound(id){
  const r = ROUNDS.find(x=>x.id===id); if (!r) return go("rounds");
  let grid;
  if (r.board){
    grid = `<div class="board" style="--cols:${r.cats.length}">
      ${r.cats.map(c=>`<div class="cat">${esc(c)}</div>`).join("")}
      ${[10,20,30,40,50].map(v => r.cats.map((c,ci)=>{
        const q = r.qs.find(x=>x.cat===ci && x.v===v);
        return q ? tile(q, v) : `<span></span>`; }).join("")).join("")}
    </div>`;
  } else {
    grid = `<div class="tiles">${r.qs.map((q,i)=>tile(q, i+1)).join("")}</div>`;
  }
  app.innerHTML = `
  <section class="round">
    <header class="page-head">
      <div><a class="link" href="#rounds">All rounds</a><h2>${esc(r.title)}</h2><p class="muted">${esc(r.sub)}. ${scoringLine(r)}.</p></div>
      <p class="next-up">Next question goes to <b style="color:${TEAM_COLORS[S.turn]}">${esc(S.teams[S.turn].name)}</b></p>
    </header>
    ${grid}
  </section>`;
  renderScores();
}
function tile(q, label){
  const used = S.used[q.id];
  return `<a class="tile ${used?"used":""} ${q.todo?"todo":""}" href="#q/${q.id}" aria-label="Question ${label}${used?", played":""}">${label}</a>`;
}

/* ---------- Question ---------- */
function renderQuestion(id){
  const q = ALLQ[id]; if (!q) return go("rounds");
  const r = roundOf(q);
  if (!cur || cur.id !== id){
    cur = { id, direct: S.turn, at: S.turn, tried: [], revealed: !!S.used[id], done: !!S.used[id] };
  }
  const P = pts(r,q), half = P/2;
  const team = S.teams[cur.at];
  const isDirect = cur.at === cur.direct && cur.tried.length === 0;
  const stake = isDirect ? `Direct: +${P}${r.neg?` / −${half}`:""}` : `Passed: +${half}`;
  const imgName = q.id + ".jpg";
  app.innerHTML = `
  <section class="question">
    <header class="q-head">
      <a class="link" href="#round/${r.id}">${esc(r.title)}</a>
      <span class="muted">${r.board ? esc(r.cats[q.cat]) + " for " + P : "Question " + (r.qs.indexOf(q)+1) + " of " + r.qs.length}</span>
    </header>
    <div class="q-body ${q.img?"has-img":""}">
      ${q.img ? `<figure class="q-img"><img src="${imgSrc(cur.revealed ? q.id+"-answer.jpg" : imgName)}" alt="" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${imgSrc(imgName)}'}else{this.parentNode.classList.add('missing')}"><figcaption>Add image: ${IMG_DIR+imgName}</figcaption></figure>` : ""}
      <p class="clue">${esc(q.q)}</p>
    </div>
    <div class="answer ${cur.revealed?"shown":""} ${cur.revealed && !q.img?"has-img":""}" aria-live="polite">
      ${cur.revealed ? `<p class="ans-text">${esc(q.a)}</p>
        ${q.img ? "" : `<figure class="ans-fig"><img class="ans-img" src="${imgSrc(q.id+"-answer.jpg")}" alt="" onerror="const a=this.closest('.answer');a.classList.remove('has-img');this.parentNode.remove();fit()"></figure>`}` : ""}
    </div>
    <footer class="controls">
      ${cur.done ? `<p class="status">${cur.result || "Already played."}</p>` : `
        <p class="status"><span class="dot" style="background:${TEAM_COLORS[cur.at]}"></span><b>${esc(team.name)}</b> <span class="muted">${stake}</span></p>
        <div class="btns">
          <button class="btn good" data-act="right">Correct</button>
          <button class="btn bad" data-act="wrong">Wrong</button>
          ${isDirect ? `<button class="btn quiet" data-act="pass">Pass</button>` : ""}
        </div>`}
      <div class="btns">
        ${!cur.revealed ? `<button class="btn quiet" data-act="reveal">Show answer</button>` : ""}
        <button class="btn quiet" data-act="back">Back to round</button>
      </div>
    </footer>
  </section>`;
  app.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(b.dataset.act, q, r));
  renderScores();
}
function act(a, q, r){
  const P = pts(r,q), half = P/2;
  const isDirect = cur.at === cur.direct && cur.tried.length === 0;
  if (a === "back") return go("round", r.id);
  if (a === "reveal"){ cur.revealed = true; return renderQuestion(q.id); }
  if (a === "right"){
    const gain = isDirect ? P : half;
    score(cur.at, gain, q.id);
    finish(q, `${S.teams[cur.at].name} got it: +${gain}`);
    return;
  }
  if (a === "wrong" && isDirect && r.neg) score(cur.at, -half, q.id);
  // wrong or pass: move on
  cur.tried.push(cur.at);
  const nextTeam = (cur.at + 1) % 4;
  if (cur.tried.length >= 4){ finish(q, "No one got it."); return; }
  cur.at = nextTeam;
  renderQuestion(q.id);
}
function finish(q, msg){
  S.used[q.id] = true; cur.done = true; cur.revealed = true; cur.result = msg;
  S.turn = (cur.direct + 1) % 4; save(); renderQuestion(q.id);
}
function score(i, d, qid){ S.teams[i].score += d; S.log.push({i, d, qid}); save(); }

/* ---------- Results ---------- */
function renderResults(){
  const ranked = S.teams.map((t,i)=>({...t, i})).sort((a,b)=>b.score-a.score);
  app.innerHTML = `
  <section class="results">
    <header class="page-head"><h2>Standings</h2><a class="link" href="#rounds">Back to rounds</a></header>
    <ol class="standings">
      ${ranked.map((t,k)=>`<li style="--c:${TEAM_COLORS[t.i]}"><span class="place">${k+1}</span><span class="st-name">${esc(t.name)}</span><span class="st-score">${t.score}</span></li>`).join("")}
    </ol>
  </section>`;
  renderScores();
}

/* ---------- Scoreboard ---------- */
function renderScores(){
  const show = S.started && document.body.dataset.view !== "home";
  board.hidden = !show;
  if (!show) return;
  board.innerHTML = `
    ${S.teams.map((t,i)=>`
      <div class="sc ${cur && !cur.done && cur.at===i && document.body.dataset.view==="q" ? "active":""}" style="--c:${TEAM_COLORS[i]}">
        <span class="sc-name">${esc(t.name)}</span>
        <span class="sc-score">${t.score}</span>
        <span class="sc-adj"><button data-adj="${i}" data-d="-5" aria-label="Minus 5 for ${esc(t.name)}">−5</button><button data-adj="${i}" data-d="5" aria-label="Plus 5 for ${esc(t.name)}">+5</button></span>
      </div>`).join("")}
    <button class="undo" id="undoBtn" ${S.log.length?"":"disabled"}>Undo</button>`;
  board.querySelectorAll("[data-adj]").forEach(b => b.onclick = () => { score(+b.dataset.adj, +b.dataset.d, null); renderScores(); });
  document.getElementById("undoBtn").onclick = () => { const l = S.log.pop(); if (l){ S.teams[l.i].score -= l.d; save(); route(); } };
}

/* ---------- Fit to screen ---------- */
// Keeps every screen inside the browser window: sizes the tile grid, then shrinks
// question text step by step until the question, picture, answer and buttons all fit.
function fit(){
  const sb = board.hidden ? 0 : board.offsetHeight;
  document.documentElement.style.setProperty("--sb", sb + "px");
  const tl = app.querySelector(".tiles");
  if (tl){
    const n = tl.children.length, g = parseFloat(getComputedStyle(tl).columnGap) || 14;
    const W = tl.clientWidth, H = tl.clientHeight;
    let best = 1, bs = 0;
    for (let c = 1; c <= n; c++){
      const rows = Math.ceil(n / c);
      const s = Math.min((W - g*(c-1)) / c, (H - g*(rows-1)) / rows, 180);
      if (s > bs){ bs = s; best = c; }
    }
    tl.style.setProperty("--cols", best);
    tl.style.setProperty("--ts", Math.max(Math.floor(bs), 44) + "px");
  }
  const box = app.querySelector(".question");
  if (box){
    let k = 1; box.style.setProperty("--k", 1);
    while (box.scrollHeight > box.clientHeight + 1 && k > 0.55){
      k -= 0.05; box.style.setProperty("--k", k.toFixed(2));
    }
  }
}
let fitQueued = false;
const queueFit = () => { if (fitQueued) return; fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fit(); }); };
new MutationObserver(queueFit).observe(app, { childList: true });
new MutationObserver(queueFit).observe(board, { childList: true, attributes: true });
window.addEventListener("resize", queueFit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit);

route();

</script>
